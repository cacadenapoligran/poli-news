<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliNews - Entrega FrontEnd</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header (Glassmorphism) -->
    <header class="glass-nav fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <div class="flex-shrink-0 flex items-center cursor-pointer group" onclick="app.navigate('home')">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center mr-3 group-hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-bolt text-white text-xl"></i>
                    </div>
                    <span class="font-extrabold text-2xl tracking-tight text-slate-900">Poli<span class="text-indigo-600">News</span></span>
                </div>
                <nav class="hidden md:flex space-x-8">
                    <a href="#" onclick="app.navigate('home')" class="nav-link font-medium text-slate-600 hover:text-indigo-600 transition">Inicio</a>
                    <a href="#" onclick="app.navigate('catalog')" class="nav-link font-medium text-slate-600 hover:text-indigo-600 transition">Explorar</a>
                    <a href="#" onclick="app.navigate('favorites')" class="nav-link font-medium text-slate-600 hover:text-indigo-600 transition">
                        <i class="fa-solid fa-bookmark mr-1"></i> Favoritos
                    </a>
                    <a href="#" onclick="app.navigate('admin')" class="nav-link font-medium text-slate-600 hover:text-indigo-600 transition">Gestión</a>
                </nav>
                <div class="hidden md:flex items-center space-x-4">
                    <button onclick="app.navigate('contact')" class="bg-slate-900 text-white px-5 py-2.5 rounded-full font-semibold hover:bg-indigo-600 transition-colors shadow-lg shadow-slate-900/20">
                        Contactar
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Dinámico -->
    <main id="app-content" class="flex-grow pt-20"></main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-300 py-12 border-t border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center">
            <div class="mb-6 md:mb-0">
                <span class="font-bold text-xl text-white">Poli<span class="text-indigo-500">News</span></span>
                <p class="text-sm mt-2 text-slate-400">Transformando la manera en que descubres el mundo.</p>
            </div>
            <div class="flex space-x-6">
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-twitter text-xl"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-github text-xl"></i></a>
                <a href="#" class="hover:text-white transition"><i class="fa-brands fa-linkedin text-xl"></i></a>
            </div>
        </div>
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 text-center text-sm text-slate-500">
            &copy; 2026 PoliNews. Todos los derechos reservados. Proyecto Académico para el Poli.
        </div>
    </footer>

    <!-- Contenedor de Notificaciones (Toasts) -->
    <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-3"></div>

    <!-- Script Principal -->
    <script src="app.js"></script>
</body>
</html>
